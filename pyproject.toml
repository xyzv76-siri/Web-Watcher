[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-watcher"
version = "0.1.0"
description = "Personal technology change monitoring and research system"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
web-watcher = "web_watcher.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
